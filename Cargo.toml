[package]
name = "bevy-asteroids"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", features = ["wav"] }
bevy-persistent = { version = "0.11.0", features = ["json"] }
dirs = "6.0.0"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }

# SVG 스프라이트를 빌드 시 PNG로 래스터화(build.rs). 빌드 전용이라 실행 바이너리엔 미포함.
[build-dependencies]
resvg = "0.44"

# 웹(wasm)에서만 난수 소스로 브라우저 crypto(Web Crypto API)를 쓰도록 getrandom
# 백엔드를 활성화한다. rand 0.10이 getrandom 0.4.3을 요구하며, wasm32-unknown-unknown
# 타깃에서는 "wasm_js" feature 없이는 컴파일 자체가 실패한다(네이티브는 무관·무영향).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# 내 코드는 빠르게 증분 컴파일하되, 의존성(bevy 등)은 최적화해 런타임 성능 확보
[profile.dev.package."*"]
opt-level = 3
